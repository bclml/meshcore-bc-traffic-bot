name: Bug report
description: Something isn't working
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Help > About in the GUI shows it.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Troubleshooting log
      description: Help > Report a bug... fills this in for you (it never contains message text). Otherwise paste the newest file from the diagnostics folder (Help > Open troubleshooting logs folder).
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Paste (Ctrl+V) or drag a picture here. Help > Report a bug... can take one for you - it blacks out chat text and names by default.
  - type: input
    id: device
    attributes:
      label: Device / board
      description: For example "Heltec V3", "LilyGo T-Beam", "RAK4631" - the report fills in the firmware if it could read it.
  - type: dropdown
    id: connection
    attributes:
      label: How is your node connected?
      options: [USB, Bluetooth, WiFi / TCP, Demo mode (no radio), Not applicable]
  - type: input
    id: addons
    attributes:
      label: Addons installed
      description: From Tools > Addons.
