# Project file so that  `uv sync`  /  `uv run mcIRC.py`  work (and `pip install -r requirements.txt` stays equivalent).
# mcIRC is an application, not a library, so it is not built or installed as a package.
[project]
name = "mcirc"
version = "1.4.3"          # keep equal to the VERSION file
description = "mIRC-style desktop chat client for MeshCore LoRa mesh nodes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "meshcore-cli>=1.5.7",
    "pyserial>=3.5",
    "tkintermapview>=1.29",
    "pillow>=10.0",
]

[project.optional-dependencies]
alerts = [                 # BC traffic bot addon / console agent:  uv sync --extra alerts
    "requests>=2.28",
    "gtfs-realtime-bindings>=1.0",
]

[project.urls]
Homepage = "https://github.com/bclml/mcIRC"
Issues = "https://github.com/bclml/mcIRC/issues"

[tool.uv]
package = false
